name: Supabase Daily Backup

# Backup diario de la base de datos de Gymspace.
# - Corre a las 04:00 UTC (01:00 ART).
# - Genera un pg_dump en formato custom, lo cifra con AES-256 y lo conserva
#   como artifact de GitHub durante 90 días.
# - workflow_dispatch permite probarlo manualmente desde la pestaña Actions.
#
# Secrets requeridos (Settings -> Secrets and variables -> Actions):
#   SUPABASE_DB_URL    Connection string del pooler en modo sesión (puerto 5432).
#   BACKUP_PASSPHRASE  Frase secreta usada para cifrar y descifrar los backups.

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch: {}

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Install PostgreSQL client
        run: |
          sudo sh -c 'echo "deb http://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo gpg --dearmor -o /etc/apt/trusted.gpg.d/pgdg.gpg
          sudo apt-get update
          sudo apt-get install -y postgresql-client-17

      - name: Dump database
        env:
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          STAMP=$(date -u +%Y-%m-%d_%H%M)
          echo "STAMP=$STAMP" >> "$GITHUB_ENV"
          /usr/lib/postgresql/17/bin/pg_dump --version
          /usr/lib/postgresql/17/bin/pg_dump "$DB_URL" --no-owner --no-acl -Fc -f "gymspace-$STAMP.dump"
          ls -lh "gymspace-$STAMP.dump"

      - name: Encrypt backup (AES-256)
        env:
          PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          gpg --batch --yes --passphrase "$PASSPHRASE" --cipher-algo AES256 -c "gymspace-$STAMP.dump"
          rm -f "gymspace-$STAMP.dump"

      - name: Upload encrypted backup artifact
        uses: actions/upload-artifact@v4
        with:
          name: gymspace-backup-${{ env.STAMP }}
          path: gymspace-*.dump.gpg
          retention-days: 90
